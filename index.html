<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Classic Sudoku - Easy</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #6c5ce7, #00bcd4);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      background: #fff;
      border-radius: 15px;
      padding: 1.5rem;
      width: 95%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      color: #6c5ce7;
      margin-bottom: 1rem;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      background: #f1f1f1;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .sudoku-grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 1px;
      background: #2d3436;
      border: 3px solid #2d3436;
    }

    .cell {
      background: white;
      aspect-ratio: 1 / 1;
      text-align: center;
      vertical-align: middle;
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .prefilled {
      background: #f0f0f0;
      color: #2d3436;
      pointer-events: none;
    }

    .editable:hover {
      background-color: #e0f0ff;
    }

    .cell.active {
      outline: 2px solid #6c5ce7;
      background-color: #dfe6fd;
    }

    .number-pad {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .num-key {
      padding: 0.8rem;
      background-color: #f1f2f6;
      border: none;
      font-size: 1.1rem;
      border-radius: 10px;
      cursor: pointer;
    }

    .num-key:hover {
      background-color: #dcdde1;
    }

    .num-key.delete {
      background-color: #ff6b6b;
      color: white;
    }

    .num-key.delete:hover {
      background-color: #ff4d4d;
    }
  </style>
</head>
<body>

<div class="game-container">
  <h2>Classic Sudoku - Easy</h2>

  <div class="status-bar">
    <span><i class="fas fa-check-square"></i> <span id="filled-count">0/81</span></span>
    <span><i class="fas fa-lightbulb"></i> Hints Left: 3</span>
  </div>

  <div class="sudoku-grid" id="sudokuGrid"></div>

  <div class="number-pad">
    <button class="num-key">1</button>
    <button class="num-key">2</button>
    <button class="num-key">3</button>
    <button class="num-key">4</button>
    <button class="num-key">5</button>
    <button class="num-key">6</button>
    <button class="num-key">7</button>
    <button class="num-key">8</button>
    <button class="num-key">9</button>
    <button class="num-key delete"><i class="fas fa-delete-left"></i></button>
  </div>
</div>

<script>
  const puzzle = [
    [3, 2, 1, 0, 0, 9, 0, 6, 8],
    [4, 9, 7, 0, 2, 0, 0, 1, 3],
    [0, 6, 5, 0, 7, 1, 2, 4, 9],
    [5, 4, 0, 7, 0, 0, 0, 0, 6],
    [0, 0, 2, 0, 0, 0, 0, 5, 0],
    [0, 0, 6, 2, 9, 0, 0, 0, 4],
    [0, 5, 8, 1, 0, 0, 0, 0, 0],
    [0, 3, 9, 6, 0, 0, 0, 8, 0],
    [0, 0, 4, 9, 8, 2, 0, 0, 0]
  ];

  let activeCell = null;

  function renderGrid() {
    const grid = document.getElementById('sudokuGrid');
    grid.innerHTML = '';
    let filled = 0;

    puzzle.flat().forEach((value, i) => {
      const cell = document.createElement('div');
      cell.classList.add('cell');

      if (value !== 0) {
        cell.textContent = value;
        cell.classList.add('prefilled');
        filled++;
      } else {
        cell.classList.add('editable');
        cell.setAttribute('data-index', i);
        cell.addEventListener('click', () => {
          if (activeCell) activeCell.classList.remove('active');
          activeCell = cell;
          cell.classList.add('active');
        });
      }

      grid.appendChild(cell);
    });

    document.getElementById('filled-count').textContent = `${filled}/81`;
  }

  document.querySelectorAll('.num-key').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!activeCell) return;

      const val = btn.textContent.trim();
      if (btn.classList.contains('delete')) {
        activeCell.textContent = '';
      } else {
        activeCell.textContent = val;
      }

      updateFilledCount();
    });
  });

  function updateFilledCount() {
    const cells = document.querySelectorAll('.cell');
    let count = 0;
    cells.forEach(cell => {
      if (cell.textContent.trim()) count++;
    });
    document.getElementById('filled-count').textContent = `${count}/81`;
  }

  renderGrid();
</script>

</body>
</html>
